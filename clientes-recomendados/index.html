<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes recomendados - RoCla VPN</title>
    <meta name="theme-color" content="#0255F4">
    <link rel="icon" type="image/webp" href="/roclavpn-logo.webp">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="/blog/style.css?v=20261113-2">
    <style>
    /* Clientes recomendados — diseño RoCla VPN (2026-11-15):
       tarjetas por cliente, Hiddify como recomendación principal,
       descargas en píldoras y pros/contras en filas suaves.
       Solo vive en esta carcasa; no toca el CSS compartido del blog. */
    #article-container { max-width: 880px; }
    #title { font-family: 'Josefin Sans', Inter, sans-serif; letter-spacing: -.01em; }
    #cr-subtitle { color: var(--muted); font-size: 1.05rem; line-height: 1.55; margin: 2px 0 8px; }
    #title::before {
        content: "RoCla VPN · Recomendaciones";
        display: block;
        font-family: Inter, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--primary);
        margin-bottom: 12px;
    }
    #title::after {
        content: "";
        display: block;
        width: 56px;
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--primary), #7aa8ff);
        margin-top: 16px;
    }
    #content h3 { font-family: 'Josefin Sans', Inter, sans-serif; }
    #content figure img { border-radius: 20px; }

    #content .cr-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 26px 26px 10px;
        margin: 24px 0;
        box-shadow: 0 12px 32px rgba(0, 0, 0, .05);
    }
    #content .cr-card h3 { margin-top: 0; font-size: 1.7rem; }
    #content .cr-card.cr-featured { border-color: rgba(2, 84, 245, .45); position: relative; overflow: hidden; }
    #content .cr-card.cr-featured::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), #7aa8ff);
    }
    #content .cr-badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 13px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .02em;
        margin: 2px 0 6px;
    }
    #content .cr-downloads { display: flex; flex-wrap: wrap; gap: 9px; margin: 4px 0 18px; }
    #content .cr-downloads a.cr-pill {
        display: inline-flex;
        align-items: center;
        padding: 10px 18px;
        min-height: 44px;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
        color: var(--text);
        font-size: .92rem;
        font-weight: 600;
        text-decoration: none;
        transition: background .2s, color .2s, border-color .2s;
    }
    #content .cr-downloads a.cr-pill:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
    #content .cr-card h4 {
        font-size: .95rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 20px;
    }
    #content .cr-row {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 14px;
        margin: 0 0 8px;
        font-size: 1rem;
        line-height: 1.5;
    }
    #content .cr-head { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    #content .cr-logo {
        width: 64px;
        height: 64px;
        flex: 0 0 64px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid var(--line);
        padding: 7px;
        box-sizing: border-box;
        object-fit: contain;
        margin: 0;
        display: block;
    }
    #content .cr-card.cr-featured .cr-logo { width: 72px; height: 72px; flex-basis: 72px; border-radius: 18px; }
    #content .cr-head-main h3 { margin: 0; }
    #content .cr-protos { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 14px; }
    #content .cr-protos span {
        font-size: .8rem;
        font-weight: 600;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 11px;
        background: var(--bg);
    }
    #content .cr-card.cr-featured .cr-protos span { color: var(--primary); border-color: rgba(2, 84, 245, .35); }
    #content .cr-downloads a.cr-pill.cr-detected {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        order: -1;
    }
    #content .cr-head-main .cr-badge { margin-top: 6px; }
    #content .cr-steps li::marker { color: var(--primary); font-weight: 700; }
    #content .cr-cta-title a { color: var(--primary); }

    @media (max-width: 620px) {
        #content .cr-card { padding: 20px 16px 4px; border-radius: 20px; }
        #content .cr-card h3 { font-size: 1.45rem; }
        #content .cr-row { font-size: .95rem; }
        #content .cr-head { gap: 12px; }
        #content .cr-logo { width: 54px; height: 54px; flex-basis: 54px; border-radius: 13px; }
        #content .cr-card.cr-featured .cr-logo { width: 58px; height: 58px; flex-basis: 58px; border-radius: 15px; }
    }
    </style>
</head>
<body>

    <div id="article-container">
        <h1 id="title">Clientes recomendados</h1>
        <p id="cr-subtitle">Elija una aplicación compatible con su llave de RoCla VPN.</p>
        <div id="content" data-url="Clientes-recomendados-11-15-2" data-date="Diciembre 01, 2025"></div>
    </div>

    <script src="/blog/script.js?v=20261002-2315"></script>
    <script>
    /* Mejora visual de esta página: envuelve cada cliente en una tarjeta,
       marca Hiddify como recomendación principal, convierte las descargas
       en píldoras y los pros/contras en filas. No cambia textos ni enlaces. */
    (function () {
        var CLIENTS = { hiddify: 1, outline: 1, wireguard: 1 };
        var LOGOS = {
            hiddify: '/assets/clientes/hiddify.svg',
            outline: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Outline_VPN_icon.png/256px-Outline_VPN_icon.png',
            wireguard: '/assets/clientes/wireguard.svg'
        };
        var PROTOS = {
            hiddify: ['VLESS', 'WireGuard', 'Shadowsocks', 'Hysteria2'],
            outline: ['Shadowsocks'],
            wireguard: ['WireGuard']
        };
        function detectedOS() {
            var ua = navigator.userAgent || '';
            if (/android/i.test(ua)) return 'Android';
            if (/iphone|ipad|ipod/i.test(ua)) return 'iPhone';
            if (/windows/i.test(ua)) return 'Windows';
            if (/macintosh|mac os/i.test(ua)) return 'MacOS';
            if (/linux/i.test(ua)) return 'Linux';
            return '';
        }
        var timer = null;

        function enhance() {
            var content = document.getElementById('content');
            if (!content || content.dataset.crDone) return;
            var h3s = content.querySelectorAll('h3');
            if (!h3s.length) return;
            content.dataset.crDone = '1';

            // Pasos de la introducción
            h3s.forEach(function (h) {
                if (h.textContent.trim().toLowerCase().indexOf('usar su cuenta') === 0) {
                    var ol = h.nextElementSibling;
                    while (ol && ol.tagName !== 'OL' && ol.tagName !== 'H3') ol = ol.nextElementSibling;
                    if (ol && ol.tagName === 'OL') ol.classList.add('cr-steps');
                }
                if (h.textContent.trim().toLowerCase().indexOf('comience a utilizar') === 0) {
                    h.classList.add('cr-cta-title');
                }
            });

            // Tarjetas por cliente
            h3s.forEach(function (h) {
                var key = h.textContent.trim().toLowerCase();
                if (!CLIENTS[key]) return;
                var card = document.createElement('section');
                card.className = 'cr-card' + (key === 'hiddify' ? ' cr-featured' : '');
                h.parentNode.insertBefore(card, h);
                var node = h;
                while (node && !(node !== h && node.tagName === 'H3')) {
                    var next = node.nextSibling;
                    card.appendChild(node);
                    node = next;
                }
                // Cabecera de la tarjeta: foto/logo del programa + nombre
                var head = document.createElement('div');
                head.className = 'cr-head';
                var logo = document.createElement('img');
                logo.className = 'cr-logo';
                logo.src = LOGOS[key];
                logo.alt = 'Logo de ' + h.textContent.trim();
                logo.loading = 'lazy';
                logo.width = 60;
                logo.height = 60;
                var headMain = document.createElement('div');
                headMain.className = 'cr-head-main';
                card.insertBefore(head, card.firstChild);
                head.appendChild(logo);
                head.appendChild(headMain);
                headMain.appendChild(h);
                if (key === 'hiddify') {
                    var badge = document.createElement('span');
                    badge.className = 'cr-badge';
                    badge.textContent = 'Recomendación principal';
                    headMain.appendChild(badge);
                }
                // Protocolos compatibles en chips, bajo la descripción
                var desc = head.nextElementSibling;
                if (desc && desc.tagName === 'P' && PROTOS[key]) {
                    var pr = document.createElement('div');
                    pr.className = 'cr-protos';
                    PROTOS[key].forEach(function (t) {
                        var s = document.createElement('span');
                        s.textContent = t;
                        pr.appendChild(s);
                    });
                    desc.insertAdjacentElement('afterend', pr);
                }
                // Descargas en píldoras: el párrafo con 3+ enlaces de la tarjeta
                var osName = detectedOS();
                card.querySelectorAll('p').forEach(function (p) {
                    var links = p.querySelectorAll('a');
                    if (links.length >= 3 && !p.dataset.crDl) {
                        p.dataset.crDl = '1';
                        var anchors = Array.prototype.slice.call(links);
                        p.textContent = '';
                        p.classList.add('cr-downloads');
                        anchors.forEach(function (a) {
                            a.classList.add('cr-pill');
                            if (osName && a.textContent.trim() === osName) a.classList.add('cr-detected');
                            p.appendChild(a);
                        });
                    }
                });
                // Pros y contras en filas
                card.querySelectorAll('p').forEach(function (p) {
                    var t = p.textContent.trim();
                    if (t.indexOf('✅') === 0 || t.indexOf('❌') === 0) p.classList.add('cr-row');
                });
            });

            // Respeta el ancla de llegada (#Hiddify, #Outline, #WireGuard)
            if (location.hash) {
                var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
                if (target) target.scrollIntoView();
            }
        }

        function schedule() {
            if (timer) clearTimeout(timer);
            timer = setTimeout(enhance, 350);
        }

        var contentEl = document.getElementById('content');
        if (contentEl) {
            new MutationObserver(schedule).observe(contentEl, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', schedule);
        schedule();
    })();
    </script>
</body>
</html>
